# Cloudflare Workers configuration for BATTLE TRADE Engine 24/7 Autonomous execution
# Configuración de Wrangler para despliegue autónomo 24/7 en Cloudflare Workers

name = "battle-trade"
main = "worker.ts"
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat"]

# Serve the complete React App Single Page Application (SPA) directly from Cloudflare
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
NODE_ENV = "production"
BASE_MAINNET_RPC = "https://mainnet.base.org"
BSC_MAINNET_RPC = "https://binance.llamarpc.com"

# Cron trigger for 24/7 Autonomous Paper Trading execution every minute
[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "TRADING_KV"
id = "326fc96903984c0dae6ca6781128f46a"

# Secrets required in Cloudflare dashboard / CI:
# GEMINI_API_KEY
# GROQ_API_KEY
# TELEGRAM_BOT_TOKEN
# TELEGRAM_CHAT_ID

