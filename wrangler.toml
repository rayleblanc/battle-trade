# Cloudflare Workers configuration for BATTLE TRADE Engine 24/7 Autonomous execution
# Configuración de Wrangler para despliegue autónomo 24/7 en Cloudflare Workers

name = "battle-trade-engine"
main = "worker.ts"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"
BASE_MAINNET_RPC = "https://mainnet.base.org"
BSC_MAINNET_RPC = "https://binance.llamarpc.com"

# Cron trigger for 24/7 Autonomous Paper Trading execution every minute
[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "TRADING_KV"
id = "trading_kv_state_store"

# Commands to set up secrets in production:
# wrangler secret put GEMINI_API_KEY
# wrangler secret put GROQ_API_KEY
# wrangler secret put TELEGRAM_BOT_TOKEN
# wrangler secret put TELEGRAM_CHAT_ID

